services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Credenciales HTTP Basic del endpoint protegido.
      # Definilas en un archivo .env (ver .env.example). Los valores de abajo
      # son solo defaults de desarrollo.
      - API_USERNAME=${API_USERNAME:-admin}
      - API_PASSWORD=${API_PASSWORD:-changeme}
    volumes:
      - ./app:/code/app          # hot-reload del código de la app
      - ./tests:/code/tests      # tests disponibles en el contenedor
      - paddle_models:/root/.paddleocr  # modelos cacheados entre reinicios
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  paddle_models:
